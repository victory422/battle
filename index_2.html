<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}</style>
</head>
<body>
<title>Storm Battle Orders</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: control column (setup + roster + squad editor) beside a live preview of the export image; stacks on phones. */
:root{
  --bg:#e7eae6; --panel:#f6f7f4; --ink:#1b211e; --muted:#5c665f; --line:#c9cfc8;
  --accent:#e0a100; --accent-ink:#1b1606; --chip:#dde2dc; --danger:#b4412a;
  --f-display:"Oswald","Noto Sans KR","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Noto Sans KR",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --panel:#1b211e; --ink:#e7ebe6; --muted:#97a29a; --line:#313a35;
  --accent:#f2b705; --accent-ink:#1b1606; --chip:#262e2a; --danger:#e07a5f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --panel:#1b211e; --ink:#e7ebe6; --muted:#97a29a; --line:#313a35;
  --accent:#f2b705; --accent-ink:#1b1606; --chip:#262e2a; --danger:#e07a5f; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1500px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;max-width:62ch}
.langs{display:flex;gap:10px;flex-wrap:wrap}
.langs .field{flex:0 0 auto}
.grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sec-label{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:600 13px var(--f-body);padding:8px 12px;border-radius:4px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg button:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 160px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:600}
input[type=text],textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 9px;width:100%}
textarea{font-family:var(--f-mono);font-size:12.5px;min-height:150px;resize:vertical}
.btn{font:600 13px var(--f-body);padding:9px 14px;border-radius:4px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn.small{padding:6px 10px;font-size:12px}
.btn.danger{color:var(--danger)}
.hint{font-size:12px;color:var(--muted);margin:0}
.note{font-size:12px;color:var(--muted);border-left:3px solid var(--accent);padding:6px 10px;background:var(--chip);border-radius:0 4px 4px 0;margin:0}
.tbl-wrap{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--chip);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.num{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
td.name{max-width:150px;overflow:hidden;text-overflow:ellipsis}
td select{padding:3px 6px;font-size:12px;width:auto}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stat{background:var(--chip);border-radius:4px;padding:4px 8px;font-size:12px}
.stat b{font-family:var(--f-mono)}
.preview{position:relative;min-width:0}
.preview canvas{width:100%;height:auto;display:block;border-radius:6px;border:1px solid var(--line);background:#11161a;touch-action:none}
.preview canvas.editing{cursor:grab;outline:2px dashed var(--accent);outline-offset:3px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.toast{font-size:12px;color:var(--muted)}
.err{color:var(--danger)}
.sq-list{display:flex;flex-direction:column;gap:8px}
details.sq{border:1px solid var(--line);border-radius:5px;background:var(--bg)}
details.sq summary{cursor:pointer;padding:9px 12px;font-weight:600;display:flex;align-items:center;gap:8px;list-style:none}
details.sq summary::-webkit-details-marker{display:none}
details.sq summary::after{content:"▾";margin-left:auto;color:var(--muted)}
details.sq[open] summary::after{content:"▴"}
details.sq summary .badge{font-family:var(--f-display);width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;color:#11161a;font-size:13px;flex:none}
details.sq summary .share{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500}
.sq-body{padding:4px 12px 12px;display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:76px minmax(0,1fr) minmax(0,1fr) auto;gap:6px;padding:8px;border-radius:4px;background:var(--chip)}
.step .txt{grid-column:1/-1}
.step input,.step select{font-size:12.5px;padding:5px 7px}
.icon-btn{font:600 13px var(--f-body);border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:4px;padding:0 9px;cursor:pointer}
.icon-btn:hover{color:var(--danger);border-color:var(--danger)}
.gate{min-height:70vh;display:grid;place-items:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gate form{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:24px;width:min(360px,100%);display:flex;flex-direction:column;gap:12px}
.gate h2{font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:.04em;margin:0}
.gate .err{font-size:12px;min-height:1em;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="gate" id="gate">
  <form id="gateForm" autocomplete="off">
    <h2>insert code please.</h2>
    <input type="text" id="gateCode" aria-label="Code" autocomplete="off" spellcheck="false">
    <button class="btn primary" type="submit">Enter</button>
    <p class="err" id="gateErr" aria-live="polite"></p>
  </form>
</div>

<div class="wrap" id="app" hidden>
  <header class="top">
    <div>
      <h1 data-t="appTitle">Storm Battle Orders</h1>
      <p class="sub" data-t="appSub"></p>
    </div>
    <div class="langs">
      <div class="field"><label for="uiLang" data-t="uiLang"></label>
        <select id="uiLang"><option value="en">English</option><option value="ko">한국어</option><option value="pt">Português (BR)</option></select></div>
      <div class="field"><label for="imgLang" data-t="imgLang"></label>
        <select id="imgLang"><option value="en">English</option><option value="ko">한국어</option><option value="pt">Português (BR)</option></select></div>
    </div>
  </header>

  <div class="grid">
    <section class="panel" aria-label="Setup">
      <p class="sec-label" data-t="s1"></p>
      <div class="seg" id="bfSeg">
        <button type="button" data-v="desert" data-t="bf.desert"></button>
        <button type="button" data-v="canyon" data-t="bf.canyon"></button>
      </div>

      <div id="desertOpts" class="row">
        <div class="field"><label data-t="ourSide"></label>
          <div class="seg" id="dSideSeg"><button type="button" data-v="W" data-t="west"></button><button type="button" data-v="E" data-t="east"></button></div></div>
      </div>

      <div id="canyonOpts" class="row" hidden>
        <div class="field" style="flex-basis:100%"><label data-t="faction"></label>
          <div class="seg" id="facSeg"><button type="button" data-v="rule" data-t="fac.rule"></button><button type="button" data-v="dawn" data-t="fac.dawn"></button></div></div>
        <div class="field" id="dawnSideF"><label data-t="ourSpawn"></label>
          <div class="seg" id="cSideSeg"><button type="button" data-v="L" data-t="sw"></button><button type="button" data-v="R" data-t="se"></button></div></div>
        <div class="field" id="dawnRoleF"><label data-t="job"></label>
          <div class="seg" id="roleSeg"><button type="button" data-v="assault" data-t="assault"></button><button type="button" data-v="hold" data-t="hold"></button></div></div>
      </div>

      <div class="row">
        <div class="field"><label for="tag" data-t="tagL"></label><input type="text" id="tag" maxlength="40"></div>
        <div class="field"><label for="when" data-t="whenL"></label><input type="text" id="when" maxlength="60"></div>
      </div>

      <p class="sec-label" data-t="s2"></p>
      <textarea id="roster" spellcheck="false" aria-label="Roster"></textarea>
      <p class="hint" data-ih="rosterHint"></p>
      <div class="row"><button class="btn primary" type="button" id="applyBtn" data-t="build"></button><button class="btn" type="button" id="sampleBtn" data-t="sample"></button><span class="toast" id="parseMsg"></span></div>

      <p class="sec-label" data-t="s3"></p>
      <div class="stats" id="stats"></div>
      <div class="tbl-wrap"><table><thead><tr><th>#</th><th data-t="thName"></th><th style="text-align:right" data-t="thPower"></th><th data-t="thAssign"></th></tr></thead><tbody id="tbody"></tbody></table></div>
      <p class="hint" data-t="adjHint"></p>

      <p class="sec-label" data-t="s4"></p>
      <p class="hint" data-t="edHint"></p>
      <div id="sqEditor" class="sq-list"></div>
      <div class="row"><button class="btn" type="button" data-act="addSquad" id="addSqBtn" data-t="addSq"></button><button class="btn" type="button" data-act="resetPlan" id="resetPlanBtn" data-t="resetSq"></button></div>
      <p class="hint" id="planMsg"></p>
      <div class="field"><label for="tipsEd" data-t="tipsL"></label><textarea id="tipsEd" spellcheck="false" style="min-height:130px;font-family:var(--f-body);font-size:13px"></textarea></div>
    </section>

    <section class="preview" aria-label="Battle orders image">
      <div class="toolbar">
        <button class="btn primary" type="button" id="dlBtn" data-t="saveImg"></button>
        <button class="btn" type="button" id="copyBtn" data-t="copyTxt"></button>
        <button class="btn" type="button" id="editBtn" aria-pressed="false" data-t="move"></button>
        <button class="btn" type="button" id="resetBtn" hidden data-t="resetMap"></button>
        <span class="toast" id="toast"></span>
      </div>
      <p class="note" data-t="mapNote"></p>
      <div style="height:10px"></div>
      <canvas id="cv" width="1600" height="2400" aria-label="Battle orders image preview"></canvas>
      <textarea id="copyFallback" hidden readonly aria-label="Orders text"></textarea>
    </section>
  </div>
</div>

/* ---------------- roster parsing ---------------- */
function toMillions(numStr, suf){
  const v = parseFloat(numStr.replace(/,/g,''));
  if (!isFinite(v)) return NaN;
  const s = (suf||'').toUpperCase();
  if (s === 'B') return v*1000;
  if (s === 'M') return v;
  if (s === 'K') return v/1000;
  return v >= 100000 ? v/1e6 : v;
}
function parseRoster(text){
  const out = [], bad = [];
  text.split(/\r?\n/).forEach(raw => {
    const line = raw.trim();
    if (!line) return;
    let m = line.match(/^(.+?)[\s,;|\t]+([\d][\d.,]*)\s*([kKmMbB])?\s*$/);
    let name, p;
    if (m){ name = m[1]; p = toMillions(m[2], m[3]); }
    else if ((m = line.match(/^([\d][\d.,]*)\s*([kKmMbB])?[\s,;|\t]+(.+)$/))){ name = m[3]; p = toMillions(m[1], m[2]); }
    if (!m || !isFinite(p) || p <= 0){ bad.push(line); return; }
    name = name.replace(/[\s,;|]+$/,'').trim();
    if (name) out.push({name, power: Math.round(p*10)/10});
  });
  return {members: out, bad};
}

/* ---------------- allocation ---------------- */
function allocate(members, squads, cfg){
  const nS = squads.length;
  const res = squads.map(() => ({members:[], power:0}));
  const subs = [], bench = [], out = [];
  const pool = members.slice().sort((a,b) => b.power - a.power);
  const forcedSq = [], forcedSub = [], autos = [];
  pool.forEach(m => {
    const ov = m.ov || 'auto';
    if (ov === 'out') out.push(m);
    else if (ov === 'sub') forcedSub.push(m);
    else if (ov.startsWith('sq') && +ov.slice(2) < nS) forcedSq.push(m);
    else autos.push(m);
  });
  const slots = Math.max(0, cfg.starters - forcedSq.length);
  const starters = autos.slice(0, slots);
  const rest = autos.slice(slots);
  forcedSub.concat(rest).forEach(m => (subs.length < cfg.subs ? subs : bench).push(m));
  forcedSq.forEach(m => { const i = +m.ov.slice(2); res[i].members.push(m); res[i].power += m.power; });

  const total = forcedSq.concat(starters).reduce((s,m) => s + m.power, 0) || 1;
  const n = forcedSq.length + starters.length;
  const wsum = squads.reduce((s, q) => s + (q.w > 0 ? q.w : 0), 0) || 1;
  const share = squads.map(q => (q.w > 0 ? q.w : 0.01) / wsum);
  const target = share.map(w => w * total);
  const maxCnt = share.map(w => Math.max(2, Math.ceil(n * w * 1.5)));
  const queue = starters.slice();
  // leaders: the strongest auto members seed empty squads, heaviest squad first
  squads.map((s,i) => i).sort((a,b) => squads[b].w - squads[a].w).forEach(i => {
    if (!res[i].members.length && queue.length){ const m = queue.shift(); res[i].members.push(m); res[i].power += m.power; }
  });
  queue.forEach(m => {
    let best = -1, bestR = Infinity;
    for (let i = 0; i < nS; i++){
      if (res[i].members.length >= maxCnt[i]) continue;
      const r = res[i].power / target[i];
      if (r < bestR - 1e-9 || (Math.abs(r-bestR) < 1e-9 && squads[i].w > squads[best].w)){ bestR = r; best = i; }
    }
    if (best < 0) best = res.reduce((bi, r, i) => r.power/target[i] < res[bi].power/target[bi] ? i : bi, 0);
    res[best].members.push(m); res[best].power += m.power;
  });
  res.forEach(r => r.members.sort((a,b) => b.power - a.power));
  return {squads: res, subs, bench, out, total};
}

  const r = state.result;
  for (let i = 0; i < r.squads.length; i++) if (r.squads[i].members.includes(m)) return {kind:'sq', i};
  if (r.subs.includes(m)) return {kind:'sub'};
  if (r.bench.includes(m)) return {kind:'bench'};
  return {kind:'out'};
}

      .map(([v,l]) => `<option value="${v}"${m.ov===v?' selected':''}>${esc(l)}</option>`).join('');

    return `<tr><td class="num">${idx+1}</td><td class="name" title="${esc(m.name)}">${dot}${esc(m.name)}</td><td class="num">${m.power.toFixed(1)}M</td><td><select id="ov-${idx}" data-name="${esc(m.name)}" aria-label="${esc(m.name)}">${opts}</select></td></tr>`;
  }).join('') || `<tr><td colspan="4" class="hint" style="padding:12px">${esc(UI('emptyTable'))}</td></tr>`;
  const st = r.squads.map((s,i) => `<span class="stat"><span class="dot" style="background:${SQ_COLORS[i]}"></span>${esc(sq[i].name)} <b>${s.members.length}</b> · <b>${fmtP(s.power)}</b></span>`).join('');
  $('stats').innerHTML = st + `<span class="stat">${esc(UI('sub'))} <b>${r.subs.length}</b></span>` + (r.bench.length ? `<span class="stat">${esc(UI('bench'))} <b>${r.bench.length}</b></span>` : '');
}

function fmtP(v){ return v >= 1000 ? (v/1000).toFixed(2)+'B' : v.toFixed(1)+'M'; }

/* ---------------- canvas drawing ---------------- */
const FD = '"Oswald","Noto Sans KR","Arial Narrow",Arial,sans-serif';
const FB = '"IBM Plex Sans","Noto Sans KR",system-ui,sans-serif';
const FM = '"IBM Plex Mono","Noto Sans KR",ui-monospace,monospace';
const IMG = { W:1600, pad:48, bg:'#11161a', panel:'#1a2126', line:'#2c363d', ink:'#eef2f0', muted:'#93a19b', accent:'#f2b705' };

function bpos(bfKey, b){ const p = (state.pos[bfKey]||{})[b.id]; return p ? {x:p.x, y:p.y} : {x:b.x, y:b.y}; }

function fitText(c, text, maxW){
  if (c.measureText(text).width <= maxW) return text;
  let t = text;
  while (t.length > 1 && c.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}
// wraps on spaces; a single word wider than the line (e.g. long Korean phrase) is broken by characters
function wrapLines(c, text, maxW){
  const words = String(text).split(' '), lines = []; let cur = '';
  const push = w => {
    if (c.measureText(w).width <= maxW) return w;
    let part = '';
    for (const ch of w){ if (c.measureText(part + ch).width > maxW && part){ lines.push(part); part = ch; } else part += ch; }
    return part;
  };
  words.forEach(w => {
    const t = cur ? cur + ' ' + w : w;
    if (c.measureText(t).width > maxW){ if (cur) lines.push(cur); cur = push(w); } else cur = t;
  });
  if (cur) lines.push(cur);
  return lines;
}
function rrect(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function spacing(c, px){ if ('letterSpacing' in c) c.letterSpacing = px + 'px'; }

function layoutCards(c, plan, res, colW){
  return plan.squads.map((s, i) => {
    c.font = `500 21px ${FB}`;
    let stepsH = 0;
    s.steps.forEach(st => { stepsH += Math.max(1, wrapLines(c, st.txt, colW - 150).length) * 28 + 8; });
    const rows = Math.ceil(Math.max(1, res.squads[i].members.length) / 2);
    return 74 + 14 + stepsH + 18 + rows * 34 + 22;
  });
}

let mapRect = {x:0, y:0, w:0, h:0, s:1};

function draw(){
  const c = ctx, {W, pad} = IMG, cfg = state.cfg, bf = BF[cfg.bf], plan = state.plan, res = state.result;
  const innerW = W - pad*2, colGap = 24, colW = (innerW - colGap) / 2;
  const cardH = layoutCards(c, plan, res, colW);
  const colY = [0, 0], cardPos = [];
  cardH.forEach(h => { const col = colY[0] <= colY[1] ? 0 : 1; cardPos.push({col, y: colY[col]}); colY[col] += h + colGap; });
  const cardsH = Math.max(colY[0], colY[1]) - colGap;
  const headerH = 170, mapH = Math.round(innerW * 620 / 1000);
  const subsList = res.subs, subsRows = Math.max(1, Math.ceil(subsList.length / 4));
  const subsH = 70 + subsRows * 34 + 10;
  c.font = `400 21px ${FB}`;
  const tipLines = plan.tips.map(t => wrapLines(c, t, colW - 90));
  const tipHalf = Math.ceil(plan.tips.length / 2), tipCol = i => (i < tipHalf ? 0 : 1);
  const tipColH = [0,0]; tipLines.forEach((l, i) => { tipColH[tipCol(i)] += l.length * 29 + 14; });
  const tipsH = 70 + Math.max(tipColH[0], tipColH[1]) + 8;
  c.font = `400 17px ${FB}`;
  const footLines = wrapLines(c, IM('footer'), innerW);
  const H = headerH + 20 + mapH + 30 + cardsH + 30 + subsH + 24 + tipsH + 40 + footLines.length * 24;
  cv.width = W; cv.height = Math.ceil(H);

  c.fillStyle = IMG.bg; c.fillRect(0, 0, W, H);

  // header
  c.fillStyle = '#161c21'; c.fillRect(0, 0, W, headerH);
  c.fillStyle = IMG.accent; c.fillRect(0, headerH - 6, W, 6);
  c.textBaseline = 'alphabetic';
  c.fillStyle = IMG.accent; c.font = `600 20px ${FD}`; spacing(c, 4);
  c.fillText(IM('hdr'), pad, 50);
  spacing(c, 1);
  c.fillStyle = IMG.ink; c.font = `700 64px ${FD}`;
  const title = fitText(c, IM(bf.key).toUpperCase(), 820);
  c.fillText(title, pad, 118);
  const tw = c.measureText(title).width;
  if (cfg.tag){ c.fillStyle = IMG.accent; c.font = `600 40px ${FD}`; c.fillText(fitText(c, '· ' + cfg.tag, Math.max(120, 1000 - tw)), pad + tw + 18, 116); }
  spacing(c, 0);
  c.fillStyle = IMG.muted; c.font = `500 21px ${FB}`;
  c.fillText(fitText(c, plan.subtitle, 960), pad, 150);
  c.textAlign = 'right';
  c.fillStyle = IMG.ink; c.font = `600 22px ${FB}`;
  if (cfg.when) c.fillText(fitText(c, cfg.when, 520), W - pad, 50);
  const nStart = res.squads.reduce((s, q) => s + q.members.length, 0);
  c.fillStyle = IMG.muted; c.font = `500 18px ${FB}`;
  c.fillText(IM('startersTotal'), W - pad, 94);
  c.fillStyle = IMG.ink; c.font = `700 40px ${FM}`;
  const totP = res.squads.reduce((s, q) => s + q.power, 0);
  c.fillText(`${nStart} · ${fmtP(totP)}`, W - pad, 140);
  c.textAlign = 'left';

  // map
  const mx = pad, my = headerH + 20, mw = innerW, mh = mapH, s = mw / 1000;
  mapRect = {x:mx, y:my, w:mw, h:mh, s};
  drawMap(c, mx, my, mw, mh, s, bf, plan);

  // squad cards
  const cy0 = my + mh + 30;
  plan.squads.forEach((sq, i) => {
    const x = pad + cardPos[i].col * (colW + colGap), y = cy0 + cardPos[i].y;
    drawCard(c, x, y, colW, cardH[i], sq, res.squads[i], i);
  });

  // subs
  let y = cy0 + cardsH + 30;
  rrect(c, pad, y, innerW, subsH, 8); c.fillStyle = IMG.panel; c.fill();
  c.fillStyle = IMG.ink; c.font = `600 26px ${FD}`; c.fillText(IM('subsT'), pad + 24, y + 42);
  const stw = c.measureText(IM('subsT')).width;
  c.fillStyle = IMG.muted; c.font = `500 18px ${FB}`;
  c.fillText(fitText(c, IM('subsDesc'), innerW - stw - 70), pad + 24 + stw + 18, y + 41);
  const sw = (innerW - 48) / 4;
  if (!subsList.length){ c.fillStyle = IMG.muted; c.font = `400 20px ${FB}`; c.fillText(IM('noneImg'), pad + 24, y + 86); }
  subsList.forEach((m, i) => {
    const sx = pad + 24 + (i % 4) * sw, sy = y + 86 + Math.floor(i / 4) * 34;
    c.fillStyle = IMG.ink; c.font = `500 20px ${FB}`; c.fillText(fitText(c, m.name, sw - 110), sx, sy);
    c.fillStyle = IMG.muted; c.font = `500 18px ${FM}`; c.textAlign = 'right'; c.fillText(fmtP(m.power), sx + sw - 18, sy); c.textAlign = 'left';
  });

  // rules of engagement
  y += subsH + 24;
  rrect(c, pad, y, innerW, tipsH, 8); c.fillStyle = IMG.panel; c.fill();
  c.fillStyle = IMG.accent; c.fillRect(pad, y, 6, tipsH);
  c.fillStyle = IMG.ink; c.font = `600 26px ${FD}`; c.fillText(IM('rulesT'), pad + 24, y + 42);
  const ty = [y + 84, y + 84];
  tipLines.forEach((lines, i) => {
    const col = tipCol(i), tx = pad + 24 + col * (colW + colGap);
    c.fillStyle = IMG.accent; c.font = `700 20px ${FM}`; c.fillText(String(i+1).padStart(2,'0'), tx, ty[col]);
    c.fillStyle = IMG.ink; c.font = `400 21px ${FB}`;
    lines.forEach((ln, k) => c.fillText(ln, tx + 38, ty[col] + k * 29));
    ty[col] += lines.length * 29 + 14;
  });

  // footer
  c.fillStyle = IMG.muted; c.font = `400 17px ${FB}`;
  footLines.forEach((ln, k) => c.fillText(ln, pad, H - 24 - (footLines.length - 1 - k) * 24));
}

function glyph(c, ic, x, y, s, col){
  c.save(); c.translate(x, y); c.fillStyle = col; c.strokeStyle = col; c.lineWidth = Math.max(2, s*0.16); c.lineCap = 'round'; c.lineJoin = 'round';
  const P = () => c.beginPath();
  if (ic === 'cross'){ const a = s*0.28, b = s*0.85; c.fillRect(-a/2*1.2, -b/2, a*1.2, b); c.fillRect(-b/2, -a/2*1.2, b, a*1.2); }
  else if (ic === 'drop'){ P(); c.moveTo(0, -s*0.5); c.bezierCurveTo(s*0.45, -s*0.05, s*0.42, s*0.45, 0, s*0.45); c.bezierCurveTo(-s*0.42, s*0.45, -s*0.45, -s*0.05, 0, -s*0.5); c.fill(); }
  else if (ic === 'atom'){ for (let k = 0; k < 3; k++){ const a0 = -Math.PI/2 + k*2*Math.PI/3 - 0.5; P(); c.moveTo(0,0); c.arc(0, 0, s*0.5, a0, a0 + 1.0); c.closePath(); c.fill(); } P(); c.arc(0, 0, s*0.12, 0, 7); c.fillStyle = '#14181b'; c.fill(); }
  else if (ic === 'shield'){ P(); c.moveTo(0, -s*0.48); c.lineTo(s*0.4, -s*0.32); c.lineTo(s*0.34, s*0.12); c.quadraticCurveTo(s*0.2, s*0.4, 0, s*0.5); c.quadraticCurveTo(-s*0.2, s*0.4, -s*0.34, s*0.12); c.lineTo(-s*0.4, -s*0.32); c.closePath(); c.fill(); }
  else if (ic === 'gear'){ for (let k = 0; k < 8; k++){ c.save(); c.rotate(k*Math.PI/4); c.fillRect(-s*0.09, -s*0.5, s*0.18, s*0.22); c.restore(); } P(); c.arc(0, 0, s*0.32, 0, 7); c.fill(); P(); c.arc(0, 0, s*0.13, 0, 7); c.fillStyle = '#14181b'; c.fill(); }
  else if (ic === 'dish'){ P(); c.arc(-s*0.2, s*0.25, s*0.08, 0, 7); c.fill(); [0.3, 0.55].forEach(r => { P(); c.arc(-s*0.2, s*0.25, s*r, -Math.PI/2, 0); c.stroke(); }); P(); c.moveTo(-s*0.2, s*0.25); c.lineTo(-s*0.2, s*0.5); c.stroke(); }
  else if (ic === 'flask'){ P(); c.moveTo(-s*0.12, -s*0.48); c.lineTo(-s*0.12, -s*0.1); c.lineTo(-s*0.4, s*0.42); c.lineTo(s*0.4, s*0.42); c.lineTo(s*0.12, -s*0.1); c.lineTo(s*0.12, -s*0.48); c.closePath(); c.fill(); }
  else if (ic === 'bolt'){ P(); c.moveTo(s*0.1, -s*0.52); c.lineTo(-s*0.3, s*0.06); c.lineTo(-s*0.02, s*0.06); c.lineTo(-s*0.12, s*0.52); c.lineTo(s*0.3, -s*0.08); c.lineTo(s*0.02, -s*0.08); c.closePath(); c.fill(); }
  else if (ic === 'bio'){ for (let k = 0; k < 3; k++){ const a = -Math.PI/2 + k*2*Math.PI/3; P(); c.arc(Math.cos(a)*s*0.22, Math.sin(a)*s*0.22, s*0.22, 0, 7); c.stroke(); } P(); c.arc(0, 0, s*0.1, 0, 7); c.fill(); }
  else if (ic === 'target'){ P(); c.arc(0, 0, s*0.34, 0, 7); c.stroke(); P(); c.arc(0, 0, s*0.08, 0, 7); c.fill(); [[0,-1],[0,1],[-1,0],[1,0]].forEach(([dx,dy]) => { P(); c.moveTo(dx*s*0.22, dy*s*0.22); c.lineTo(dx*s*0.52, dy*s*0.52); c.stroke(); }); }
  else if (ic === 'box'){ c.fillRect(-s*0.42, -s*0.18, s*0.84, s*0.6); c.fillRect(-s*0.48, -s*0.38, s*0.96, s*0.16); c.fillStyle = '#14181b'; c.fillRect(-s*0.1, -s*0.18, s*0.2, s*0.24); }
  c.restore();
}

function drawMap(c, mx, my, mw, mh, s, bf, plan){
  const cfg = state.cfg, L = cfg.img;
  c.save();
  rrect(c, mx, my, mw, mh, 10); c.clip();
  const g = c.createRadialGradient(mx + mw/2, my + mh/2, 20, mx + mw/2, my + mh/2, mw*0.62);
  if (bf.theme === 'desert'){ g.addColorStop(0, '#3b2a12'); g.addColorStop(1, '#130e08'); }
  else { g.addColorStop(0, '#12262e'); g.addColorStop(1, '#070f13'); }
  c.fillStyle = g; c.fillRect(mx, my, mw, mh);
  // fine dot texture
  c.fillStyle = 'rgba(255,255,255,0.035)';
  for (let gx = 10; gx < 1000; gx += 25) for (let gy = 10; gy < 620; gy += 25){ c.fillRect(mx + gx*s, my + gy*s, 2, 2); }

  const B = {}; bf.buildings.forEach(b => { B[b.id] = Object.assign({}, b, bpos(cfg.bf, b)); });

  // road links between buildings
  c.save(); c.setLineDash([9, 9]); c.lineWidth = 2; c.strokeStyle = 'rgba(255,255,255,0.16)';
  (bf.links || []).forEach(([a, b]) => { if (!B[a] || !B[b]) return; c.beginPath(); c.moveTo(mx + B[a].x*s, my + B[a].y*s); c.lineTo(mx + B[b].x*s, my + B[b].y*s); c.stroke(); });
  c.restore();

  // zones
  bf.zones(cfg).forEach(z => {
    const lbl = tr(z.k, L), usLbl = tr('us', L);
    const fg = z.ours ? IMG.accent : z.neutral ? '#55d1b8' : '#8fb4ff';
    if (z.band){
      const bw = 34, bx = z.band === 'L' ? mx : mx + mw - bw;
      c.fillStyle = z.ours ? 'rgba(242,183,5,0.20)' : 'rgba(239,90,60,0.14)'; c.fillRect(bx, my, bw, mh);
      c.fillStyle = z.ours ? IMG.accent : 'rgba(239,106,60,0.75)'; c.fillRect(z.band === 'L' ? bx + bw - 3 : bx, my, 3, mh);
      c.save(); c.translate(bx + bw/2, my + mh/2); c.rotate(z.band === 'L' ? -Math.PI/2 : Math.PI/2);
      c.fillStyle = z.ours ? IMG.accent : '#f19172'; c.font = `600 18px ${FD}`; c.textAlign = 'center'; spacing(c, 3);
      c.fillText(lbl + (z.ours ? '   ' + usLbl : ''), 0, 6); spacing(c, 0); c.restore();
      return;
    }
    const zx = mx + z.x*s, zy = my + z.y*s, zw = z.w*s, zh = z.h*s;
    rrect(c, zx, zy, zw, zh, 6);
    c.fillStyle = z.ours ? 'rgba(242,183,5,0.20)' : z.neutral ? 'rgba(47,196,163,0.08)' : 'rgba(10,16,20,0.75)'; c.fill();
    c.setLineDash(z.neutral ? [7,6] : []); c.lineWidth = 2;
    c.strokeStyle = z.ours ? IMG.accent : z.neutral ? 'rgba(85,209,184,0.6)' : 'rgba(143,180,255,0.6)'; c.stroke(); c.setLineDash([]);
    c.fillStyle = fg; c.font = `600 18px ${FD}`; c.textAlign = 'center'; spacing(c, 2);
    const arrowCh = z.k === 'zA1' ? '▲ ' : z.neutral ? '' : '▼ ';
    c.fillText(fitText(c, arrowCh + lbl + (z.ours ? '  ' + usLbl : ''), zw - 12), zx + zw/2, zy + zh/2 + 6);
    spacing(c, 0); c.textAlign = 'left';
  });

  // squad movement arrows
  plan.squads.forEach((sq, i) => {
    const pts = sq.steps.filter(st => st.ids.length && B[st.ids[0]]).map(st => B[st.ids[0]]);
    for (let k = 0; k < pts.length - 1; k++){
      const a = pts[k], b = pts[k+1]; if (a === b) continue;
      const off = (i - (plan.squads.length-1)/2) * 6;
      arrow(c, mx + a.x*s + off, my + a.y*s + off, mx + b.x*s + off, my + b.y*s + off, SQ_COLORS[i], k > 0);
    }
  });

  // buildings with squad badges
  const marks = {};
  plan.squads.forEach((sq, i) => sq.steps.forEach((st, k) => st.ids.forEach(id => {
    (marks[id] = marks[id] || []);
    if (!marks[id].some(m => m.i === i)) marks[id].push({i, k});
  })));
  Object.values(B).forEach(b => {
    const x = mx + b.x*s, y = my + b.y*s;
    const r = [22, 25, 29, 36][b.tier];
    // glow for the main objective
    if (b.tier === 3){ const gg = c.createRadialGradient(x, y, r*0.6, x, y, r*2.2); gg.addColorStop(0, b.col + '66'); gg.addColorStop(1, b.col + '00'); c.fillStyle = gg; c.beginPath(); c.arc(x, y, r*2.2, 0, 7); c.fill(); }
    // hex pad
    c.beginPath();
    for (let k = 0; k < 6; k++){ const a = Math.PI/6 + k*Math.PI/3; const px = x + Math.cos(a)*r, py = y + Math.sin(a)*r*0.9; k ? c.lineTo(px, py) : c.moveTo(px, py); }
    c.closePath(); c.fillStyle = '#14181b'; c.fill(); c.lineWidth = 3; c.strokeStyle = b.col; c.stroke();
    glyph(c, b.ic, x, y, r*1.05, b.col);
    // label pill
    const name = tr(b.n, L), tag = tr(b.g, L);
    c.textAlign = 'center';
    c.font = `700 19px ${FB}`; const nw = c.measureText(name).width;
    c.font = `500 15px ${FB}`; const gw = c.measureText(tag).width;
    const lw = Math.max(nw, gw) + 22, ly = y + r + 8;
    rrect(c, x - lw/2, ly, lw, 46, 6); c.fillStyle = 'rgba(8,10,12,0.9)'; c.fill();
    c.lineWidth = 1.5; c.strokeStyle = b.col + 'aa'; c.stroke();
    c.fillStyle = IMG.ink; c.font = `700 19px ${FB}`; c.fillText(name, x, ly + 21);
    c.fillStyle = IMG.muted; c.font = `500 15px ${FB}`; c.fillText(tag, x, ly + 39);
    c.textAlign = 'left';
    const ms = marks[b.id] || [];
    const bw = 34, total = ms.length * bw;
    ms.forEach((m, j) => {
      const bx = x - total/2 + j*bw + bw/2, by = y - r - 20;
      c.beginPath(); c.arc(bx, by, 15, 0, Math.PI*2);
      if (m.k === 0){ c.fillStyle = SQ_COLORS[m.i]; c.fill(); c.lineWidth = 2; c.strokeStyle = '#11161a'; c.stroke(); c.fillStyle = '#11161a'; }
      else { c.fillStyle = '#11161a'; c.fill(); c.lineWidth = 3; c.strokeStyle = SQ_COLORS[m.i]; c.stroke(); c.fillStyle = SQ_COLORS[m.i]; }
      c.font = `700 17px ${FD}`; c.textAlign = 'center'; c.fillText(String.fromCharCode(65 + m.i), bx, by + 6); c.textAlign = 'left';
    });
  });

  // legend (bottom right for desert, top right for canyon)
  c.font = `500 16px ${FB}`;
  const l1 = tr('lgOpen', L), l2 = tr('lgLater', L);
  const lwid = 26 + c.measureText(l1).width + 22 + 26 + c.measureText(l2).width + 10;
  const lx = mx + mw - lwid - (bf.theme === 'desert' ? 50 : 16), lyy = bf.theme === 'desert' ? my + mh - 18 : my + 38;
  rrect(c, lx - 8, lyy - 24, lwid + 8, 34, 6); c.fillStyle = 'rgba(8,10,12,0.75)'; c.fill();
  c.beginPath(); c.arc(lx + 10, lyy - 6, 10, 0, Math.PI*2); c.fillStyle = IMG.accent; c.fill();
  c.fillStyle = IMG.ink; c.fillText(l1, lx + 26, lyy);
  const l2x = lx + 26 + c.measureText(l1).width + 22;
  c.beginPath(); c.arc(l2x + 10, lyy - 6, 10, 0, Math.PI*2); c.fillStyle = '#11161a'; c.fill(); c.lineWidth = 3; c.strokeStyle = IMG.accent; c.stroke();
  c.fillStyle = IMG.ink; c.fillText(l2, l2x + 26, lyy);
  c.restore();
  c.lineWidth = 2; c.strokeStyle = IMG.line; rrect(c, mx, my, mw, mh, 10); c.stroke();
}

function arrow(c, x1, y1, x2, y2, color, dashed){
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy); if (len < 40) return;
  const ux = dx/len, uy = dy/len, sx = x1 + ux*32, sy = y1 + uy*32, ex = x2 - ux*40, ey = y2 - uy*40;
  const cx = (sx+ex)/2 - uy*len*0.12, cy = (sy+ey)/2 + ux*len*0.12;
  c.save();
  c.strokeStyle = 'rgba(0,0,0,0.45)'; c.lineWidth = 8; c.setLineDash(dashed ? [14,10] : []);
  c.beginPath(); c.moveTo(sx, sy); c.quadraticCurveTo(cx, cy, ex, ey); c.stroke();
  c.strokeStyle = color; c.lineWidth = 4;
  c.beginPath(); c.moveTo(sx, sy); c.quadraticCurveTo(cx, cy, ex, ey); c.stroke();
  c.setLineDash([]);
  const ang = Math.atan2(ey - cy, ex - cx);
  c.fillStyle = color; c.beginPath();
  c.moveTo(ex + Math.cos(ang)*6, ey + Math.sin(ang)*6);
  c.lineTo(ex - Math.cos(ang - 0.5)*18, ey - Math.sin(ang - 0.5)*18);
  c.lineTo(ex - Math.cos(ang + 0.5)*18, ey - Math.sin(ang + 0.5)*18);
  c.closePath(); c.fill();
  c.restore();
}

function drawCard(c, x, y, w, h, sq, r, i){
  const col = SQ_COLORS[i];
  rrect(c, x, y, w, h, 8); c.fillStyle = IMG.panel; c.fill();
  c.save(); rrect(c, x, y, w, h, 8); c.clip(); c.fillStyle = col; c.fillRect(x, y, w, 6); c.restore();
  c.beginPath(); c.arc(x + 42, y + 44, 22, 0, Math.PI*2); c.fillStyle = col; c.fill();
  c.fillStyle = '#11161a'; c.font = `700 26px ${FD}`; c.textAlign = 'center'; c.fillText(String.fromCharCode(65+i), x + 42, y + 53); c.textAlign = 'left';
  c.fillStyle = IMG.ink; c.font = `600 30px ${FD}`; c.fillText(fitText(c, (sq.name || '').toUpperCase(), w - 280), x + 78, y + 47);
  c.fillStyle = IMG.muted; c.font = `400 17px ${FB}`; c.fillText(fitText(c, sq.role || '', w - 260), x + 78, y + 70);
  c.textAlign = 'right';
  c.fillStyle = IMG.ink; c.font = `700 24px ${FM}`; c.fillText(fmtP(r.power), x + w - 22, y + 46);
  c.fillStyle = IMG.muted; c.font = `500 16px ${FB}`; c.fillText(IM('playersN', {n: r.members.length}), x + w - 22, y + 70);
  c.textAlign = 'left';
  let yy = y + 74 + 14 + 22;
  sq.steps.forEach(st => {
    const tw = 110;
    rrect(c, x + 22, yy - 20, tw, 28, 4); c.fillStyle = 'rgba(255,255,255,0.07)'; c.fill();
    c.fillStyle = col; c.font = `600 17px ${FM}`; c.textAlign = 'center'; c.fillText(fitText(c, st.t || '—', tw - 8), x + 22 + tw/2, yy); c.textAlign = 'left';
    c.fillStyle = IMG.ink; c.font = `500 21px ${FB}`;
    const lines = wrapLines(c, st.txt, w - 150);
    lines.forEach((ln, k) => c.fillText(ln, x + 22 + tw + 14, yy + k*28));
    yy += Math.max(1, lines.length) * 28 + 8;
  });
  yy += 2; c.fillStyle = IMG.line; c.fillRect(x + 22, yy - 8, w - 44, 1);
  const cw = (w - 44) / 2;
  if (!r.members.length){ c.fillStyle = IMG.muted; c.font = `400 19px ${FB}`; c.fillText(IM('noPlayers'), x + 22, yy + 24); }
  r.members.forEach((m, k) => {
    const px = x + 22 + (k % 2) * cw, py = yy + 24 + Math.floor(k / 2) * 34;
    const lead = k === 0;
    c.fillStyle = lead ? col : IMG.ink; c.font = `${lead ? 700 : 500} 20px ${FB}`;
    c.fillText(fitText(c, (lead ? '★ ' : '') + m.name, cw - 100), px, py);
    c.fillStyle = IMG.muted; c.font = `500 17px ${FM}`; c.textAlign = 'right'; c.fillText(fmtP(m.power), px + cw - 14, py); c.textAlign = 'left';
  });
}

/* ---------------- map editing ---------------- */
let drag = null;
function canvasPt(e){
  const rc = cv.getBoundingClientRect();
  return { x: (e.clientX - rc.left) * cv.width / rc.width, y: (e.clientY - rc.top) * cv.height / rc.height };
}
cv.addEventListener('pointerdown', e => {
  if (!state.editing) return;
  const p = canvasPt(e), {x, y, s} = mapRect, bf = BF[state.cfg.bf];
  let best = null, bd = 50;
  bf.buildings.forEach(b => { const q = bpos(state.cfg.bf, b); const d = Math.hypot(x + q.x*s - p.x, y + q.y*s - p.y); if (d < bd){ bd = d; best = b; } });
  if (best){ drag = best; cv.setPointerCapture(e.pointerId); e.preventDefault(); }
});
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const p = canvasPt(e), {x, y, s} = mapRect;
  const nx = Math.max(20, Math.min(980, (p.x - x) / s)), ny = Math.max(30, Math.min(560, (p.y - y) / s));
  (state.pos[state.cfg.bf] = state.pos[state.cfg.bf] || {})[drag.id] = {x: Math.round(nx), y: Math.round(ny)};
  draw();
});
['pointerup','pointercancel'].forEach(ev => cv.addEventListener(ev, () => { if (drag){ drag = null; save(); } }));
$('editBtn').addEventListener('click', () => {
  state.editing = !state.editing;
  $('editBtn').setAttribute('aria-pressed', String(state.editing));
  $('editBtn').textContent = UI(state.editing ? 'done' : 'move');
  $('resetBtn').hidden = !state.editing;
  cv.classList.toggle('editing', state.editing);
});
$('resetBtn').addEventListener('click', () => { delete state.pos[state.cfg.bf]; save(); draw(); toast(UI('tMapReset')); });

/* ---------------- export ---------------- */
function toast(t){ $('toast').textContent = t; clearTimeout(toast._t); toast._t = setTimeout(() => $('toast').textContent = '', 6000); }
let downloads = null;
if (window.claude && typeof window.claude.use === 'function'){
  window.claude.use('downloads').then(d => { downloads = d; }).catch(() => {});
}
$('dlBtn').addEventListener('click', () => {
  draw();
  cv.toBlob(async blob => {
    if (!blob){ toast(UI('tNoImg')); return; }
    const fname = `${state.cfg.bf}-storm-orders${state.cfg.tag ? '-' + state.cfg.tag.replace(/[^\w-]+/g,'') : ''}.png`;
    if (downloads){
      try { await downloads.save({filename: fname, data: blob}); toast(UI('tSaved')); return; }
      catch(err){ if (err && err.code === 'declined'){ toast(UI('tCancel')); return; } }
    }
    // outside claude.ai (self-hosted copy) a plain download link works; also show the image to save by hand
    const url = URL.createObjectURL(blob);
    try { const a = document.createElement('a'); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); } catch(e){}
    const img = new Image(); img.src = url; img.alt = 'Battle orders image'; img.style.cssText = 'width:100%;border-radius:6px;margin-top:10px';
    const old = document.getElementById('fallbackImg'); if (old) old.remove();
    img.id = 'fallbackImg'; cv.after(img);
    toast(UI('tFallback'));
  }, 'image/png');
});

function ordersText(){
  const p = state.plan, r = state.result, c = state.cfg;
  const L = [`[${IM(BF[c.bf].key)}${c.tag ? ' · ' + c.tag : ''}] ${p.subtitle}${c.when ? ' · ' + c.when : ''}`];
  p.squads.forEach((s, i) => {
    L.push('', `${String.fromCharCode(65+i)}. ${s.name.toUpperCase()} (${fmtP(r.squads[i].power)})`);
    s.steps.forEach(st => L.push(`  ${st.t} — ${st.txt}`));
    L.push('  ' + r.squads[i].members.map((m, k) => (k === 0 ? '★' : '') + m.name).join(', '));
  });
  L.push('', IM('subsLine') + ': ' + (r.subs.map(m => m.name).join(', ') || IM('noneImg')));
  return L.join('\n');
}
$('copyBtn').addEventListener('click', () => {
  const t = ordersText();
  const fb = () => { const ta = $('copyFallback'); ta.hidden = false; ta.value = t; ta.style.minHeight = '220px'; ta.focus(); ta.select(); toast(UI('tSelCopy')); };
  try { navigator.clipboard.writeText(t).then(() => toast(UI('tCopied')), fb); } catch(e){ fb(); }
});

/* ---------------- wiring ---------------- */
bindSeg('bfSeg', 'bf'); bindSeg('dSideSeg', 'dSide'); bindSeg('facSeg', 'fac'); bindSeg('cSideSeg', 'cSide'); bindSeg('roleSeg', 'role');
['tag','when'].forEach(k => { const el = $(k); el.value = state.cfg[k] || ''; el.addEventListener('input', () => { state.cfg[k] = el.value; save(); draw(); }); });
$('uiLang').addEventListener('change', e => { state.cfg.ui = e.target.value; save(); applyUI(); parseMsg(); refresh(); });
$('imgLang').addEventListener('change', e => { state.cfg.img = e.target.value; save(); refresh(); });
$('roster').value = state.rosterText;
$('applyBtn').addEventListener('click', applyRoster);
$('sampleBtn').addEventListener('click', () => { $('roster').value = SAMPLE; applyRoster(); });

applyUI();
applyRoster();
const fontsToLoad = ['700 64px Oswald','600 20px Oswald','500 20px "IBM Plex Sans"','600 20px "IBM Plex Sans"','700 20px "IBM Plex Mono"','500 20px "IBM Plex Mono"','500 20px "Noto Sans KR"','700 20px "Noto Sans KR"'];
if (document.fonts && document.fonts.load){
  Promise.all(fontsToLoad.map(f => document.fonts.load(f).catch(() => {}))).then(() => draw());
  document.fonts.ready.then(() => draw());
}
window.__sbo = {parseRoster, allocate, buildPlan, BF, tr};

/* ---------------- entry ---------------- */
const GRID_TICKS = ['=UGa','jFGc','hBSZ','jlmb'];
const gridKey = () => GRID_TICKS.join('').split('').reverse().join('');
const enc = v => { try { return btoa(unescape(encodeURIComponent(v))); } catch(e){ return ''; } };
function openApp(){ $('gate').hidden = true; $('app').hidden = false; draw(); }
let seen = null; try { seen = sessionStorage.getItem('sbo:g'); } catch(e){}
if (seen === gridKey()) openApp(); else setTimeout(() => $('gateCode').focus(), 0);
$('gateForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('gateCode').value.trim().replace(/\s+/g, ' ').toLowerCase();
  if (enc(v) === gridKey()){ try { sessionStorage.setItem('sbo:g', gridKey()); } catch(err){} openApp(); }
  else { $('gateErr').textContent = 'Wrong code.'; $('gateCode').select(); }
});
})();
</script>
